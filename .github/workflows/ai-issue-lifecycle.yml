name: AI Issue Lifecycle

on:
  issue_comment:
    types:
      - created
  issues:
    types:
      - opened
      - edited
      - closed
      - reopened
      - labeled
      - unlabeled
      - assigned
      - unassigned
  pull_request_target:
    types:
      - opened
      - reopened
      - edited
      - synchronize
      - converted_to_draft
      - ready_for_review
      - closed
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: ai-issue-lifecycle-${{ github.repository }}
  cancel-in-progress: false

jobs:
  lifecycle:
    name: lifecycle
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - name: Reconcile AI Issue lifecycle
        env:
          AI_LIFECYCLE_MUTATION_MODE: ${{ vars.AI_LIFECYCLE_MUTATION_MODE || 'report' }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/github/ai-issue-controller.mjs

  stalled-work:
    name: stalled-work visibility
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - name: Report stalled collaboration
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STALE_WORK_REPORT_PATH: stale-work-report.md
        run: node scripts/github/stale-work.mjs
      - name: Preserve stalled-work report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stalled-work-report
          path: stale-work-report.md
          if-no-files-found: error
          retention-days: 14
