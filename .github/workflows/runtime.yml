name: Runtime container gate

on:
  pull_request:

permissions:
  contents: read

jobs:
  runtime:
    name: runtime
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Record tested implementation head
        shell: bash
        run: |
          set -euo pipefail
          tested_commit_sha=$(git rev-parse HEAD)
          test "$tested_commit_sha" = "${{ github.event.pull_request.head.sha }}"
          printf 'RUNTIME_TESTED_COMMIT=%s\n' "$tested_commit_sha" >> "$GITHUB_ENV"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Install native test prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep
          command -v rg
          rg --version

      - name: Generate ephemeral runtime material
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          runtime_dir=$(mktemp -d)
          chmod 700 "$runtime_dir"
          cleanup_material() {
            rm -f -- "$runtime_dir"/*
            if [[ "$runtime_dir" == /tmp/* ]] && [ -d "$runtime_dir" ]; then
              rm -rf -- "$runtime_dir"
            fi
          }
          trap cleanup_material EXIT
          RUNTIME_DIR="$runtime_dir"
          RUNTIME_ENV_FILE="$runtime_dir/runtime.env"
          RUNTIME_EVIDENCE_FILE="$runtime_dir/runtime-evidence.txt"
          RUNTIME_HEALTH_OBSERVATIONS_FILE="$runtime_dir/health-observations.txt"
          RUNTIME_DB_LOSS_OBSERVATIONS_FILE="$runtime_dir/db-loss-observations.txt"
          RUNTIME_GATE_OBSERVATIONS_FILE="$runtime_dir/gate-observations.txt"
          RUNTIME_REPOSITORY_GATE_LOG="$runtime_dir/repository-gate.log"
          RUNTIME_FOCUSED_GATE_LOG="$runtime_dir/focused-gate.log"
          RUNTIME_FOUNDATION_ACCEPTANCE_LOG="$runtime_dir/foundation-acceptance.log"
          RUNTIME_HEALTH_METRICS_BODY_FILE="$runtime_dir/health-metrics.body"
          RUNTIME_ARCHIVE="$runtime_dir/runtime-image.tar"
          QHB_TLS_KEY_FILE="$runtime_dir/qhb-runtime.key"
          QHB_TLS_CERT_FILE="$runtime_dir/qhb-runtime.crt"
          runtime_tls_key_file="$runtime_dir/qhb-runtime.uid-1000.key"
          runtime_tls_cert_file="$runtime_dir/qhb-runtime.uid-1000.crt"
          RUNTIME_IMAGE_REF=qwen-harness-bridge-control-plane
          touch "$RUNTIME_ENV_FILE" "$RUNTIME_EVIDENCE_FILE" "$RUNTIME_HEALTH_OBSERVATIONS_FILE" "$RUNTIME_DB_LOSS_OBSERVATIONS_FILE" "$RUNTIME_GATE_OBSERVATIONS_FILE" "$RUNTIME_REPOSITORY_GATE_LOG" "$RUNTIME_FOCUSED_GATE_LOG" "$RUNTIME_FOUNDATION_ACCEPTANCE_LOG"
          chmod 600 "$RUNTIME_ENV_FILE" "$RUNTIME_EVIDENCE_FILE" "$RUNTIME_HEALTH_OBSERVATIONS_FILE" "$RUNTIME_DB_LOSS_OBSERVATIONS_FILE" "$RUNTIME_GATE_OBSERVATIONS_FILE" "$RUNTIME_REPOSITORY_GATE_LOG" "$RUNTIME_FOCUSED_GATE_LOG" "$RUNTIME_FOUNDATION_ACCEPTANCE_LOG"
          {
            printf 'RUNTIME_DIR=%s\n' "$RUNTIME_DIR"
            printf 'RUNTIME_ENV_FILE=%s\n' "$RUNTIME_ENV_FILE"
            printf 'RUNTIME_EVIDENCE_FILE=%s\n' "$RUNTIME_EVIDENCE_FILE"
            printf 'RUNTIME_HEALTH_OBSERVATIONS_FILE=%s\n' "$RUNTIME_HEALTH_OBSERVATIONS_FILE"
            printf 'RUNTIME_DB_LOSS_OBSERVATIONS_FILE=%s\n' "$RUNTIME_DB_LOSS_OBSERVATIONS_FILE"
            printf 'RUNTIME_GATE_OBSERVATIONS_FILE=%s\n' "$RUNTIME_GATE_OBSERVATIONS_FILE"
            printf 'RUNTIME_REPOSITORY_GATE_LOG=%s\n' "$RUNTIME_REPOSITORY_GATE_LOG"
            printf 'RUNTIME_FOCUSED_GATE_LOG=%s\n' "$RUNTIME_FOCUSED_GATE_LOG"
            printf 'RUNTIME_FOUNDATION_ACCEPTANCE_LOG=%s\n' "$RUNTIME_FOUNDATION_ACCEPTANCE_LOG"
            printf 'RUNTIME_HEALTH_METRICS_BODY_FILE=%s\n' "$RUNTIME_HEALTH_METRICS_BODY_FILE"
            printf 'RUNTIME_ARCHIVE=%s\n' "$RUNTIME_ARCHIVE"
            printf 'RUNTIME_IMAGE_REF=%s\n' "$RUNTIME_IMAGE_REF"
            printf 'QHB_TLS_CERT_FILE=%s\n' "$QHB_TLS_CERT_FILE"
            printf 'QHB_TLS_KEY_FILE=%s\n' "$QHB_TLS_KEY_FILE"
          } >> "$GITHUB_ENV"

          POSTGRES_DB=qhb
          POSTGRES_USER=qhb
          POSTGRES_PASSWORD=$(openssl rand -hex 32)
          QHB_OWNER_ID=$(openssl rand -hex 32)
          QHB_MCP_BEARER_TOKEN=$(openssl rand -hex 32)
          QHB_REQUEST_ENCRYPTION_KEY=$(openssl rand -hex 32)
          QHB_CONNECTOR_SESSION_SIGNING_KEY=$(openssl rand -hex 32)
          unique_secret_count=$(printf '%s\n' "$POSTGRES_PASSWORD" "$QHB_OWNER_ID" "$QHB_MCP_BEARER_TOKEN" "$QHB_REQUEST_ENCRYPTION_KEY" "$QHB_CONNECTOR_SESSION_SIGNING_KEY" | sort -u | wc -l)
          test "$unique_secret_count" -eq 5

          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$QHB_TLS_KEY_FILE" -out "$QHB_TLS_CERT_FILE" -days 1 -subj "/CN=127.0.0.1" -addext "subjectAltName = IP:127.0.0.1"
          chmod 600 "$QHB_TLS_KEY_FILE" "$QHB_TLS_CERT_FILE"
          sudo install -o 1000 -g 1000 -m 0400 "$QHB_TLS_KEY_FILE" "$runtime_tls_key_file"
          sudo install -o 1000 -g 1000 -m 0444 "$QHB_TLS_CERT_FILE" "$runtime_tls_cert_file"
          rm -f -- "$QHB_TLS_KEY_FILE" "$QHB_TLS_CERT_FILE"
          QHB_TLS_KEY_FILE="$runtime_tls_key_file"
          QHB_TLS_CERT_FILE="$runtime_tls_cert_file"
          test "$(stat -c '%u:%g:%a' "$QHB_TLS_KEY_FILE")" = "1000:1000:400"
          test "$(stat -c '%u:%g:%a' "$QHB_TLS_CERT_FILE")" = "1000:1000:444"
          openssl x509 -in "$QHB_TLS_CERT_FILE" -noout -subject -ext subjectAltName | grep --fixed-strings 127.0.0.1
          {
            printf 'QHB_TLS_CERT_FILE=%s\n' "$QHB_TLS_CERT_FILE"
            printf 'QHB_TLS_KEY_FILE=%s\n' "$QHB_TLS_KEY_FILE"
          } >> "$GITHUB_ENV"

          {
            printf 'POSTGRES_DB=%s\n' "$POSTGRES_DB"
            printf 'POSTGRES_USER=%s\n' "$POSTGRES_USER"
            printf 'POSTGRES_PASSWORD=%s\n' "$POSTGRES_PASSWORD"
            printf 'QHB_OWNER_ID=%s\n' "$QHB_OWNER_ID"
            printf 'QHB_MCP_BEARER_TOKEN=%s\n' "$QHB_MCP_BEARER_TOKEN"
            printf 'QHB_REQUEST_ENCRYPTION_KEY=%s\n' "$QHB_REQUEST_ENCRYPTION_KEY"
            printf 'QHB_CONNECTOR_SESSION_SIGNING_KEY=%s\n' "$QHB_CONNECTOR_SESSION_SIGNING_KEY"
            printf 'QHB_TLS_CERT_FILE=%s\n' "$QHB_TLS_CERT_FILE"
            printf 'QHB_TLS_KEY_FILE=%s\n' "$QHB_TLS_KEY_FILE"
            printf 'CONTROL_PLANE_PORT=8443\n'
          } > "$RUNTIME_ENV_FILE"
          trap - EXIT

      - name: Build and start runtime
        shell: bash
        run: |
          set -euo pipefail
          export NO_COLOR=1
          pnpm install --frozen-lockfile
          pnpm build
          pnpm check 2>&1 | tee "$RUNTIME_REPOSITORY_GATE_LOG"
          repository_test_count=$(sed -nE 's/.*Tests[[:space:]]+([0-9]+)[[:space:]]+passed.*/\1/p' "$RUNTIME_REPOSITORY_GATE_LOG" | tail -n 1)
          test "$repository_test_count" -gt 0
          {
            printf 'repository_test_result=passed\n'
            printf 'repository_test_count=%s\n' "$repository_test_count"
          } > "$RUNTIME_GATE_OBSERVATIONS_FILE"
          # submit-latency-evidence-parser
          latency_evidence_line_count=$(grep -c '^QHB_MCP_SUBMIT_LATENCY_EVIDENCE=' "$RUNTIME_REPOSITORY_GATE_LOG" || true)
          test "$latency_evidence_line_count" -eq 1
          latency_evidence_json=$(sed -n 's/^QHB_MCP_SUBMIT_LATENCY_EVIDENCE=//p' "$RUNTIME_REPOSITORY_GATE_LOG")
          latency_evidence_canonical="$({
            printf '%s\n' "$latency_evidence_json" |
              node --input-type=module -e '
                import { readFileSync } from "node:fs";

                const expectedKeys = [
                  "measurement",
                  "sample_count",
                  "samples_ms",
                  "p50_ms",
                  "p95_ms",
                  "p99_ms",
                  "max_ms",
                  "budget_ms",
                ];
                const rawWithNewline = readFileSync(0, "utf8");
                if (!rawWithNewline.endsWith("\n")) process.exit(1);
                const raw = rawWithNewline.slice(0, -1);
                if (raw.length === 0 || /[\r\n]/.test(raw) || raw.trim() !== raw) process.exit(1);
                let evidence;
                try {
                  evidence = JSON.parse(raw);
                } catch {
                  process.exit(1);
                }
                if (JSON.stringify(evidence) !== raw) process.exit(1);
                if (typeof evidence !== "object" || evidence === null || Array.isArray(evidence)) process.exit(1);
                if (JSON.stringify(Object.keys(evidence)) !== JSON.stringify(expectedKeys)) process.exit(1);
                if (evidence.measurement !== "in_memory_mcp_call_tool") process.exit(1);
                if (!Number.isInteger(evidence.sample_count) || evidence.sample_count !== 20) process.exit(1);
                if (!Array.isArray(evidence.samples_ms) || evidence.samples_ms.length !== evidence.sample_count) process.exit(1);
                if (!evidence.samples_ms.every((sample) => typeof sample === "number" && Number.isFinite(sample) && sample >= 0)) process.exit(1);
                for (let index = 1; index < evidence.samples_ms.length; index += 1) {
                  if (evidence.samples_ms[index] < evidence.samples_ms[index - 1]) process.exit(1);
                }
                if (evidence.budget_ms !== 2000) process.exit(1);
                const nearestRank = (percentile) => evidence.samples_ms[Math.ceil(percentile * evidence.sample_count) - 1];
                for (const [key, percentile] of [["p50_ms", 0.5], ["p95_ms", 0.95], ["p99_ms", 0.99]]) {
                  if (typeof evidence[key] !== "number" || !Number.isFinite(evidence[key]) || evidence[key] !== nearestRank(percentile)) process.exit(1);
                }
                if (typeof evidence.max_ms !== "number" || !Number.isFinite(evidence.max_ms) || evidence.max_ms !== evidence.samples_ms.at(-1)) process.exit(1);
                if (!(evidence.p99_ms < evidence.budget_ms && evidence.max_ms < evidence.budget_ms)) process.exit(1);
                process.stdout.write([
                  `submit_latency_measurement=${evidence.measurement}`,
                  `submit_latency_sample_count=${evidence.sample_count}`,
                  `submit_latency_samples_ms=${JSON.stringify(evidence.samples_ms)}`,
                  `submit_latency_p50_ms=${evidence.p50_ms}`,
                  `submit_latency_p95_ms=${evidence.p95_ms}`,
                  `submit_latency_p99_ms=${evidence.p99_ms}`,
                  `submit_latency_max_ms=${evidence.max_ms}`,
                  `submit_latency_budget_ms=${evidence.budget_ms}`,
                ].join("\n"));
              '
          })"
          test -n "$latency_evidence_canonical"
          printf '%s\n' "$latency_evidence_canonical" >> "$RUNTIME_GATE_OBSERVATIONS_FILE"
          # end submit-latency-evidence-parser
          : > "$RUNTIME_FOUNDATION_ACCEPTANCE_LOG"
          chmod 600 "$RUNTIME_FOUNDATION_ACCEPTANCE_LOG"
          pnpm exec vitest run --config /dev/null \
            tests/contract/mcp-tools.test.ts \
            tests/integration/job-repository.test.ts \
            tests/integration/connector-outbox.test.ts \
            tests/integration/connector-gateway.test.ts \
            tests/integration/foundation-e2e.test.ts \
            tests/integration/approval-flow.test.ts \
            tests/integration/cancellation-flow.test.ts \
            tests/integration/result-flow.test.ts \
            tests/integration/readiness.test.ts 2>&1 | \
              sed '/^QHB_MCP_SUBMIT_LATENCY_EVIDENCE=/d' | \
              tee "$RUNTIME_FOUNDATION_ACCEPTANCE_LOG"
          # foundation-acceptance-parser
          test -s "$RUNTIME_FOUNDATION_ACCEPTANCE_LOG"
          foundation_acceptance_count=$(sed -nE 's/.*Tests[[:space:]]+([0-9]+)[[:space:]]+passed.*/\1/p' "$RUNTIME_FOUNDATION_ACCEPTANCE_LOG" | tail -n 1)
          if ! [[ "$foundation_acceptance_count" =~ ^[1-9][0-9]*$ ]]; then exit 1; fi
          {
            printf 'foundation_acceptance_result=passed\n'
            printf 'foundation_acceptance_count=%s\n' "$foundation_acceptance_count"
          } >> "$RUNTIME_GATE_OBSERVATIONS_FILE"
          # end foundation-acceptance-parser
          pnpm exec vitest run --config /dev/null tests/contract/health-metrics.test.ts tests/integration/readiness.test.ts tests/contract/runtime-build.test.ts tests/contract/shutdown.test.ts tests/integration/connector-gateway.test.ts 2>&1 | tee "$RUNTIME_FOCUSED_GATE_LOG"
          focused_test_count=$(sed -nE 's/.*Tests[[:space:]]+([0-9]+)[[:space:]]+passed.*/\1/p' "$RUNTIME_FOCUSED_GATE_LOG" | tail -n 1)
          test "$focused_test_count" -gt 0
          {
            printf 'focused_test_result=passed\n'
            printf 'focused_test_count=%s\n' "$focused_test_count"
          } >> "$RUNTIME_GATE_OBSERVATIONS_FILE"
          docker compose --env-file "$RUNTIME_ENV_FILE" config --quiet # config--quiet
          docker compose --env-file "$RUNTIME_ENV_FILE" build --pull=false control-plane migrate
          docker compose --env-file "$RUNTIME_ENV_FILE" up -d

      - name: Verify healthy runtime
        shell: bash
        run: |
          set -euo pipefail
          runtime_url="https://127.0.0.1:8443"
          for attempt in $(seq 1 60); do
            ready_status=$(curl --connect-timeout 2 --max-time 5 --silent --show-error --output /dev/null --write-out '%{http_code}' --cacert "$QHB_TLS_CERT_FILE" "$runtime_url/health/ready" || true)
            test "$ready_status" = "200" && break
            test "$attempt" = "60" && exit 1
            sleep 1
          done
          live_status=$(curl --connect-timeout 2 --max-time 5 --silent --show-error --output /dev/null --write-out '%{http_code}' --cacert "$QHB_TLS_CERT_FILE" "$runtime_url/health/live")
          live_body=$(curl --connect-timeout 2 --max-time 5 --fail --silent --show-error --cacert "$QHB_TLS_CERT_FILE" "$runtime_url/health/live")
          ready_status=$(curl --connect-timeout 2 --max-time 5 --silent --show-error --output /dev/null --write-out '%{http_code}' --cacert "$QHB_TLS_CERT_FILE" "$runtime_url/health/ready")
          ready_body=$(curl --connect-timeout 2 --max-time 5 --fail --silent --show-error --cacert "$QHB_TLS_CERT_FILE" "$runtime_url/health/ready")
          metrics_headers_file="$RUNTIME_DIR/health-metrics.headers"
          curl --connect-timeout 2 --max-time 5 --fail --silent --show-error --dump-header "$metrics_headers_file" --output "$RUNTIME_HEALTH_METRICS_BODY_FILE" --cacert "$QHB_TLS_CERT_FILE" "$runtime_url/metrics"
          metrics_status=$(curl --connect-timeout 2 --max-time 5 --silent --show-error --output /dev/null --write-out '%{http_code}' --cacert "$QHB_TLS_CERT_FILE" "$runtime_url/metrics")
          metrics_body=$(cat "$RUNTIME_HEALTH_METRICS_BODY_FILE")
          metrics_content_type=$(grep --ignore-case '^content-type:' "$metrics_headers_file" | tr -d '\r' | sed 's/^[^:]*:[[:space:]]*//')
          test "$live_status" = "200"
          test "$live_body" = '{"status":"ok"}'
          test "$ready_status" = "200"
          test "$ready_body" = '{"status":"ready"}'
          test "$metrics_status" = "200"
          test "$metrics_content_type" = 'text/plain; version=0.0.4; charset=utf-8'
          grep --fixed-strings 'text/plain; version=0.0.4; charset=utf-8' "$metrics_headers_file"
          grep --fixed-strings 'qhb_mcp_submit_duration_seconds' "$RUNTIME_HEALTH_METRICS_BODY_FILE"
          grep --fixed-strings 'qhb_connector_online' "$RUNTIME_HEALTH_METRICS_BODY_FILE"
          grep --fixed-strings 'qhb_job_queue_age_seconds' "$RUNTIME_HEALTH_METRICS_BODY_FILE"
          if grep -E -i 'owner[_-]?id|job[_-]?id|(^|[^[:alnum:]_])[[:alnum:]_-]*repository([_-]?(id|name|url|path|context)|[^[:alnum:]_]|$)|prompt|path|https?://|url|secret|error:|stack trace|ECONNREFUSED|SQLSTATE' "$RUNTIME_HEALTH_METRICS_BODY_FILE"; then exit 1; fi
          privacy_observation=passed
          {
            printf 'live_status=%s\n' "$live_status"
            printf 'live_body=%s\n' "$live_body"
            printf 'ready_status=%s\n' "$ready_status"
            printf 'ready_body=%s\n' "$ready_body"
            printf 'metrics_status=%s\n' "$metrics_status"
            printf 'metrics_content_type=%s\n' "$metrics_content_type"
            printf 'privacy=%s\n' "$privacy_observation"
          } > "$RUNTIME_HEALTH_OBSERVATIONS_FILE"
          cat "$RUNTIME_HEALTH_METRICS_BODY_FILE" >> "$RUNTIME_HEALTH_OBSERVATIONS_FILE"
          chmod 600 "$RUNTIME_HEALTH_OBSERVATIONS_FILE"

      - name: Inspect effective runtime image
        shell: bash
        run: |
          set -euo pipefail
          container_id=$(docker compose --env-file "$RUNTIME_ENV_FILE" ps -q control-plane)
          printf 'RUNTIME_CONTAINER_ID=%s\n' "$container_id" >> "$GITHUB_ENV"
          image_ref=$(docker inspect --format '{{.Config.Image}}' "$container_id")
          printf 'RUNTIME_IMAGE_REF=%s\n' "$image_ref" >> "$GITHUB_ENV"
          docker image inspect "$image_ref" >/dev/null
          runtime_workdir=$(docker inspect --format '{{.Config.WorkingDir}}' "$image_ref")
          test -n "$runtime_workdir"
          printf 'RUNTIME_WORKDIR=%s\n' "$runtime_workdir" >> "$GITHUB_ENV"
          cleanup_image_resources() {
            docker compose --env-file "$RUNTIME_ENV_FILE" down --remove-orphans >/dev/null 2>&1 || true
            docker rm -f "$container_id" >/dev/null 2>&1 || true
            docker image rm "$image_ref" >/dev/null 2>&1 || true
            rm -f -- "$RUNTIME_ARCHIVE"
          }
          trap cleanup_image_resources EXIT
          docker export "$container_id" -o "$RUNTIME_ARCHIVE"
          archive_listing="$RUNTIME_DIR/runtime-image.list"
          tar -tf "$RUNTIME_ARCHIVE" > "$archive_listing"
          node scripts/runtime/audit-image-listing.mjs --workdir "$runtime_workdir" --listing "$archive_listing"
          trap - EXIT

      - name: Verify database failure separation
        shell: bash
        run: |
          set -euo pipefail
          runtime_url="https://127.0.0.1:8443"
          db_loss_cleanup() {
            docker compose --env-file "$RUNTIME_ENV_FILE" down --remove-orphans >/dev/null 2>&1 || true
          }
          trap db_loss_cleanup EXIT
          docker compose --env-file "$RUNTIME_ENV_FILE" stop postgres
          for attempt in $(seq 1 30); do
            readiness_status=$(curl --connect-timeout 2 --max-time 5 --silent --show-error --output /dev/null --write-out '%{http_code}' --cacert "$QHB_TLS_CERT_FILE" "$runtime_url/health/ready" || true)
            live_status=$(curl --connect-timeout 2 --max-time 5 --silent --show-error --output /dev/null --write-out '%{http_code}' --cacert "$QHB_TLS_CERT_FILE" "$runtime_url/health/live" || true)
            test "$readiness_status" = "503" && break
            test "$attempt" = "30" && exit 1
            sleep 1
          done
          readiness_headers_file="$RUNTIME_DIR/db-loss.headers"
          readiness_body_file="$RUNTIME_DIR/db-loss.body"
          readiness_status=$(curl --connect-timeout 2 --max-time 5 --silent --show-error --dump-header "$readiness_headers_file" --output "$readiness_body_file" --write-out '%{http_code}' --cacert "$QHB_TLS_CERT_FILE" "$runtime_url/health/ready" || true)
          readiness_body=$(cat "$readiness_body_file")
          readiness_content_type=$(grep --ignore-case '^content-type:' "$readiness_headers_file" | tr -d '\r' | sed 's/^[^:]*:[[:space:]]*//')
          live_body=$(curl --connect-timeout 2 --max-time 5 --fail --silent --show-error --cacert "$QHB_TLS_CERT_FILE" "$runtime_url/health/live")
          test "$readiness_status" = "503"
          test "$live_status" = "200"
          test "$live_body" = '{"status":"ok"}'
          test "$readiness_body" = '{"status":"not_ready"}'
          test "$readiness_content_type" = 'application/json; charset=utf-8'
          if grep -E -i 'owner[_-]?id|job[_-]?id|(^|[^[:alnum:]_])[[:alnum:]_-]*repository([_-]?(id|name|url|path|context)|[^[:alnum:]_]|$)|prompt|path|https?://|url|secret|error:|stack trace|ECONNREFUSED|SQLSTATE' "$readiness_body_file"; then exit 1; fi
          db_loss_privacy=passed
          {
            printf 'db_loss_readiness_status=%s\n' "$readiness_status"
            printf 'db_loss_readiness_body=%s\n' "$readiness_body"
            printf 'db_loss_readiness_content_type=%s\n' "$readiness_content_type"
            printf 'db_loss_privacy=%s\n' "$db_loss_privacy"
            printf 'db_loss_live_status=%s\n' "$live_status"
            printf 'db_loss_live_body=%s\n' "$live_body"
          } > "$RUNTIME_DB_LOSS_OBSERVATIONS_FILE"
          docker compose --env-file "$RUNTIME_ENV_FILE" start postgres
          for attempt in $(seq 1 60); do
            readiness_status=$(curl --connect-timeout 2 --max-time 5 --silent --show-error --output /dev/null --write-out '%{http_code}' --cacert "$QHB_TLS_CERT_FILE" "$runtime_url/health/ready" || true)
            test "$readiness_status" = "200" && break
            test "$attempt" = "60" && exit 1
            sleep 1
          done
          ready_body=$(curl --connect-timeout 2 --max-time 5 --fail --silent --show-error --cacert "$QHB_TLS_CERT_FILE" "$runtime_url/health/ready")
          test "$readiness_status" = "200"
          test "$ready_body" = '{"status":"ready"}'
          {
            printf 'recovery_readiness_status=%s\n' "$readiness_status"
            printf 'recovery_ready_body=%s\n' "$ready_body"
          } >> "$RUNTIME_DB_LOSS_OBSERVATIONS_FILE"
          chmod 600 "$RUNTIME_DB_LOSS_OBSERVATIONS_FILE"
          trap - EXIT

      - name: Capture runtime evidence
        shell: bash
        run: |
          set -euo pipefail
          live_status=$(sed -n 's/^live_status=//p' "$RUNTIME_HEALTH_OBSERVATIONS_FILE" | head -n 1)
          live_body=$(sed -n 's/^live_body=//p' "$RUNTIME_HEALTH_OBSERVATIONS_FILE" | head -n 1)
          ready_status=$(sed -n 's/^ready_status=//p' "$RUNTIME_HEALTH_OBSERVATIONS_FILE" | head -n 1)
          ready_body=$(sed -n 's/^ready_body=//p' "$RUNTIME_HEALTH_OBSERVATIONS_FILE" | head -n 1)
          metrics_status=$(sed -n 's/^metrics_status=//p' "$RUNTIME_HEALTH_OBSERVATIONS_FILE" | head -n 1)
          metrics_body=$(cat "$RUNTIME_HEALTH_METRICS_BODY_FILE")
          metrics_content_type=$(sed -n 's/^metrics_content_type=//p' "$RUNTIME_HEALTH_OBSERVATIONS_FILE" | head -n 1)
          privacy=$(sed -n 's/^privacy=//p' "$RUNTIME_HEALTH_OBSERVATIONS_FILE" | head -n 1)
          readiness_status=$(sed -n 's/^db_loss_readiness_status=//p' "$RUNTIME_DB_LOSS_OBSERVATIONS_FILE" | head -n 1)
          readiness_body=$(sed -n 's/^db_loss_readiness_body=//p' "$RUNTIME_DB_LOSS_OBSERVATIONS_FILE" | head -n 1)
          readiness_content_type=$(sed -n 's/^db_loss_readiness_content_type=//p' "$RUNTIME_DB_LOSS_OBSERVATIONS_FILE" | head -n 1)
          db_loss_privacy=$(sed -n 's/^db_loss_privacy=//p' "$RUNTIME_DB_LOSS_OBSERVATIONS_FILE" | head -n 1)
          recovery_readiness_status=$(sed -n 's/^recovery_readiness_status=//p' "$RUNTIME_DB_LOSS_OBSERVATIONS_FILE" | head -n 1)
          repository_test_result=$(sed -n 's/^repository_test_result=//p' "$RUNTIME_GATE_OBSERVATIONS_FILE")
          repository_test_count=$(sed -n 's/^repository_test_count=//p' "$RUNTIME_GATE_OBSERVATIONS_FILE")
          focused_test_result=$(sed -n 's/^focused_test_result=//p' "$RUNTIME_GATE_OBSERVATIONS_FILE")
          focused_test_count=$(sed -n 's/^focused_test_count=//p' "$RUNTIME_GATE_OBSERVATIONS_FILE")
          submit_latency_measurement=$(sed -n 's/^submit_latency_measurement=//p' "$RUNTIME_GATE_OBSERVATIONS_FILE")
          submit_latency_sample_count=$(sed -n 's/^submit_latency_sample_count=//p' "$RUNTIME_GATE_OBSERVATIONS_FILE")
          submit_latency_samples_ms=$(sed -n 's/^submit_latency_samples_ms=//p' "$RUNTIME_GATE_OBSERVATIONS_FILE")
          submit_latency_p50_ms=$(sed -n 's/^submit_latency_p50_ms=//p' "$RUNTIME_GATE_OBSERVATIONS_FILE")
          submit_latency_p95_ms=$(sed -n 's/^submit_latency_p95_ms=//p' "$RUNTIME_GATE_OBSERVATIONS_FILE")
          submit_latency_p99_ms=$(sed -n 's/^submit_latency_p99_ms=//p' "$RUNTIME_GATE_OBSERVATIONS_FILE")
          submit_latency_max_ms=$(sed -n 's/^submit_latency_max_ms=//p' "$RUNTIME_GATE_OBSERVATIONS_FILE")
          submit_latency_budget_ms=$(sed -n 's/^submit_latency_budget_ms=//p' "$RUNTIME_GATE_OBSERVATIONS_FILE")
          foundation_acceptance_result=$(sed -n 's/^foundation_acceptance_result=//p' "$RUNTIME_GATE_OBSERVATIONS_FILE")
          foundation_acceptance_count=$(sed -n 's/^foundation_acceptance_count=//p' "$RUNTIME_GATE_OBSERVATIONS_FILE")
          source_runtime_observations=$(cat "$RUNTIME_HEALTH_OBSERVATIONS_FILE" "$RUNTIME_DB_LOSS_OBSERVATIONS_FILE" "$RUNTIME_GATE_OBSERVATIONS_FILE")
          test -n "$source_runtime_observations"
          test "$metrics_content_type" = 'text/plain; version=0.0.4; charset=utf-8'
          test "$privacy" = passed
          test "$readiness_status" = 503
          test "$readiness_body" = '{"status":"not_ready"}'
          test "$readiness_content_type" = 'application/json; charset=utf-8'
          test "$db_loss_privacy" = passed
          test "$repository_test_result" = passed
          test "$focused_test_result" = passed
          [[ "$repository_test_count" =~ ^[1-9][0-9]*$ ]]
          [[ "$focused_test_count" =~ ^[1-9][0-9]*$ ]]
          test -s "$RUNTIME_FOUNDATION_ACCEPTANCE_LOG"
          test "$submit_latency_measurement" = "in_memory_mcp_call_tool"
          test "$submit_latency_sample_count" = "20"
          test -n "$submit_latency_samples_ms"
          [[ "$submit_latency_p50_ms" =~ ^[0-9]+([.][0-9]+)?$ ]]
          [[ "$submit_latency_p95_ms" =~ ^[0-9]+([.][0-9]+)?$ ]]
          [[ "$submit_latency_p99_ms" =~ ^[0-9]+([.][0-9]+)?$ ]]
          [[ "$submit_latency_max_ms" =~ ^[0-9]+([.][0-9]+)?$ ]]
          test "$submit_latency_budget_ms" = "2000"
          test "$foundation_acceptance_result" = passed
          [[ "$foundation_acceptance_count" =~ ^[1-9][0-9]*$ ]]
          grep --fixed-strings 'qhb_mcp_submit_duration_seconds' "$RUNTIME_HEALTH_METRICS_BODY_FILE"
          grep --fixed-strings 'qhb_connector_online' "$RUNTIME_HEALTH_METRICS_BODY_FILE"
          grep --fixed-strings 'qhb_job_queue_age_seconds' "$RUNTIME_HEALTH_METRICS_BODY_FILE"
          set -a
          source "$RUNTIME_ENV_FILE"
          set +a
          migration_tag=$(docker compose --env-file "$RUNTIME_ENV_FILE" exec -T control-plane node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const journal = JSON.parse(readFileSync("dist/db/migrations/meta/_journal.json", "utf8"));
            const entry = journal.entries?.at(-1);
            if (entry === undefined || typeof entry.tag !== "string") process.exit(1);
            process.stdout.write(entry.tag);
          ' | tr -d '\r\n')
          migration_when=$(docker compose --env-file "$RUNTIME_ENV_FILE" exec -T postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atqc 'SELECT created_at FROM drizzle.__drizzle_migrations ORDER BY created_at DESC LIMIT 1' | tr -d '\r')
          migration_sha256=$(docker compose --env-file "$RUNTIME_ENV_FILE" exec -T postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atqc 'SELECT hash FROM drizzle.__drizzle_migrations ORDER BY created_at DESC LIMIT 1' | tr -d '\r')
          test "$migration_tag" = "0002_result_acknowledgement"
          test "$migration_when" = "1788244364352"
          test "$migration_sha256" = "2e4a1f323453e6f4a7ec7319250f474ce7552c536ed3a55af4b5fe52c5a9cb89"
          image_digest="$(docker image inspect --format '{{.Id}}' "$RUNTIME_IMAGE_REF")"
          if ! printf '%s\n' "$image_digest" | grep -E '^sha256:[0-9a-f]{64}$'; then exit 1; fi
          # config-digest-parser
          config_hash_output="$(
            compose_status=0
            docker compose --env-file "$RUNTIME_ENV_FILE" config --hash control-plane || compose_status=$? # config--hash
            printf '\037'
            exit "$compose_status"
          )"
          config_hash_output="${config_hash_output%$'\037'}"
          config_digest="$(
            printf '%s' "$config_hash_output" |
              LC_ALL=C awk '
                BEGIN { valid = 1; line_count = 0 }
                {
                  line_count++
                  if (line_count != 1 || $0 !~ /^control-plane [0-9a-f]{64}$/) valid = 0
                  else hash = substr($0, 15)
                }
                END {
                  if (valid != 1 || line_count != 1) exit 1
                  printf "sha256:%s\n", hash
                }
              '
          )"
          if ! printf '%s\n' "$config_digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then exit 1; fi
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          observed_at_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          node_version=$(node --version)
          pnpm_version=$(pnpm --version)
          docker_version=$(docker version --format '{{.Server.Version}}')
          docker_compose_version=$(docker compose --env-file "$RUNTIME_ENV_FILE" version --short)
          [[ "$run_url" =~ ^https://github\.com/[^/]+/[^/]+/actions/runs/[0-9]+$ ]]
          [[ "$observed_at_utc" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
          [[ "$node_version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$pnpm_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$docker_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.+-][A-Za-z0-9.-]+)?$ ]]
          [[ "$docker_compose_version" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([.+-][A-Za-z0-9.-]+)?$ ]]
          {
            printf 'live_status=%s\n' "$live_status"
            printf 'live_body=%s\n' "$live_body"
            printf 'ready_status=%s\n' "$ready_status"
            printf 'ready_body=%s\n' "$ready_body"
            printf 'metrics_status=%s\n' "$metrics_status"
            printf 'metrics_body=%s\n' "$metrics_body"
            printf 'metrics_content_type=%s\n' "$metrics_content_type"
            printf 'tested_commit=%s\n' "$RUNTIME_TESTED_COMMIT"
            printf 'runtime_workdir=%s\n' "$RUNTIME_WORKDIR"
            printf 'privacy=%s\n' "$privacy"
            printf 'database_loss_readiness_status=%s\n' "$readiness_status"
            printf 'database_loss_readiness_body=%s\n' "$readiness_body"
            printf 'database_loss_readiness_content_type=%s\n' "$readiness_content_type"
            printf 'database_loss_privacy=%s\n' "$db_loss_privacy"
            printf 'recovery_readiness_status=%s\n' "$recovery_readiness_status"
            printf 'migration_table=__drizzle_migrations\n'
            printf 'migration_tag=%s\n' "$migration_tag"
            printf 'migration_when=%s\n' "$migration_when"
            printf 'migration_sha256=%s\n' "$migration_sha256"
            printf 'image_digest=%s\n' "$image_digest"
            printf 'config_digest=%s\n' "$config_digest"
            printf 'run_url=%s\n' "$run_url"
            printf 'observed_at_utc=%s\n' "$observed_at_utc"
            printf 'node_version=%s\n' "$node_version"
            printf 'pnpm_version=%s\n' "$pnpm_version"
            printf 'docker_version=%s\n' "$docker_version"
            printf 'docker_compose_version=%s\n' "$docker_compose_version"
            printf 'repository_test_result=%s\n' "$repository_test_result"
            printf 'repository_test_count=%s\n' "$repository_test_count"
            printf 'focused_test_result=%s\n' "$focused_test_result"
            printf 'focused_test_count=%s\n' "$focused_test_count"
            printf 'submit_latency_measurement=%s\n' "$submit_latency_measurement"
            printf 'submit_latency_sample_count=%s\n' "$submit_latency_sample_count"
            printf 'submit_latency_samples_ms=%s\n' "$submit_latency_samples_ms"
            printf 'submit_latency_p50_ms=%s\n' "$submit_latency_p50_ms"
            printf 'submit_latency_p95_ms=%s\n' "$submit_latency_p95_ms"
            printf 'submit_latency_p99_ms=%s\n' "$submit_latency_p99_ms"
            printf 'submit_latency_max_ms=%s\n' "$submit_latency_max_ms"
            printf 'submit_latency_budget_ms=%s\n' "$submit_latency_budget_ms"
            printf 'foundation_acceptance_result=%s\n' "$foundation_acceptance_result"
            printf 'foundation_acceptance_count=%s\n' "$foundation_acceptance_count"
            cat "$RUNTIME_HEALTH_OBSERVATIONS_FILE"
            cat "$RUNTIME_DB_LOSS_OBSERVATIONS_FILE"
            cat "$RUNTIME_GATE_OBSERVATIONS_FILE"
          } >> "$RUNTIME_EVIDENCE_FILE"

      - name: Upload runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: runtime-evidence
          path: ${{ env.RUNTIME_EVIDENCE_FILE }}

      - name: Cleanup runtime
        if: always()
        shell: bash
        run: |
          set +e
          if [ -n "${RUNTIME_ENV_FILE:-}" ]; then docker compose --env-file "$RUNTIME_ENV_FILE" down --volumes --remove-orphans --rmi local; fi
          if [ -n "${RUNTIME_CONTAINER_ID:-}" ]; then docker rm -f "$RUNTIME_CONTAINER_ID" >/dev/null 2>&1 || true; fi
          if [ -n "${RUNTIME_IMAGE_REF:-}" ]; then docker image rm "$RUNTIME_IMAGE_REF" >/dev/null 2>&1 || true; fi
          rm -f -- "${RUNTIME_ARCHIVE:-}" "${RUNTIME_EVIDENCE_FILE:-}"
          if [ -n "${RUNTIME_DIR:-}" ] && [ -d "$RUNTIME_DIR" ] && [[ "$RUNTIME_DIR" == /tmp/* ]]; then rm -rf -- "$RUNTIME_DIR"; fi
