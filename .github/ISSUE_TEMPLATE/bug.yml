name: Bug report
description: Report a reproducible non-security defect
title: "[Bug] "
labels:
  - "type:bug"
body:
  - type: markdown
    attributes:
      value: Do not include credentials, raw prompts/logs, source bodies, private paths, or security vulnerabilities.
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: State the concrete engineering outcome that will resolve the defect.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Use redacted identifiers and safe fixtures.
    validations:
      required: true
  - type: input
    id: dependencies
    attributes:
      label: Dependencies
      description: Use exactly "Blocked by none" or "Blocked by #12, #19".
      placeholder: Blocked by none
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: List exact commands and observed results that reproduce or verify the fix.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risk and rollback
      description: Cover security, privacy, protocol, migration, compatibility, and rollback as applicable.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: dropdown
    id: rtc
    attributes:
      label: RTC mode
      options:
        - Disabled
        - Enabled
        - Not applicable
    validations:
      required: true
  - type: checkboxes
    id: done
    attributes:
      label: Definition of done
      options:
        - label: A failing reproduction exists before the behavior change.
          required: true
        - label: Relevant automated checks pass.
          required: true
        - label: Documentation and acceptance evidence are current.
          required: true
  - type: checkboxes
    id: done
    attributes:
      label: Definition of done
      options:
        - label: A failing reproduction exists before the behavior change.
          required: true
        - label: Relevant automated checks pass.
          required: true
        - label: Documentation and acceptance evidence are current.
          required: true
