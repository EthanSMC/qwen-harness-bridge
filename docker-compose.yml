name: qwen-harness-bridge

services:
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qhb}
      POSTGRES_USER: ${POSTGRES_USER:-qhb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qhb}
    volumes:
      - qhb-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  migrate:
    image: qwen-harness-bridge-control-plane
    build:
      context: .
      dockerfile: apps/control-plane/Dockerfile
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-qhb}:${POSTGRES_PASSWORD:-qhb}@postgres:5432/${POSTGRES_DB:-qhb}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["node", "dist/db/migrate.js"]

  control-plane:
    image: qwen-harness-bridge-control-plane
    build:
      context: .
      dockerfile: apps/control-plane/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-qhb}:${POSTGRES_PASSWORD:-qhb}@postgres:5432/${POSTGRES_DB:-qhb}
      PORT: "8443"
      HOST: 0.0.0.0
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      QHB_OWNER_ID: "${QHB_OWNER_ID:?QHB_OWNER_ID must be set}"
      QHB_MCP_BEARER_TOKEN: "${QHB_MCP_BEARER_TOKEN:?QHB_MCP_BEARER_TOKEN must be set}"
      QHB_REQUEST_ENCRYPTION_KEY: "${QHB_REQUEST_ENCRYPTION_KEY:?QHB_REQUEST_ENCRYPTION_KEY must be set}"
      QHB_CONNECTOR_SESSION_SIGNING_KEY: "${QHB_CONNECTOR_SESSION_SIGNING_KEY:?QHB_CONNECTOR_SESSION_SIGNING_KEY must be set}"
      QHB_TLS_CERT_PATH: /run/secrets/qhb_tls_cert
      QHB_TLS_KEY_PATH: /run/secrets/qhb_tls_key
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["node", "dist/main.js"]
    ports:
      - "127.0.0.1:${CONTROL_PLANE_PORT:-8443}:8443"
    secrets:
      - source: qhb_tls_cert
        target: qhb_tls_cert
        uid: "1000"
        gid: "1000"
        mode: "0440"
      - source: qhb_tls_key
        target: qhb_tls_key
        uid: "1000"
        gid: "1000"
        mode: "0400"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          const https = require('node:https'); const request = https.get('https://127.0.0.1:8443/health/ready', { rejectUnauthorized: false }, response => { response.resume(); process.exitCode = response.statusCode === 200 ? 0 : 1; }); request.on('error', () => process.exit(1));
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  qhb-postgres-data:

secrets:
  qhb_tls_cert:
    file: "${QHB_TLS_CERT_FILE:?QHB_TLS_CERT_FILE must point to a TLS certificate file}"
  qhb_tls_key:
    file: "${QHB_TLS_KEY_FILE:?QHB_TLS_KEY_FILE must point to a TLS private key file}"
