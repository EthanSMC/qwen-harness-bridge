name: qwen-harness-bridge

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qhb}
      POSTGRES_USER: ${POSTGRES_USER:-qhb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qhb}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - qhb-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  control-plane:
    build:
      context: .
      dockerfile: apps/control-plane/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-qhb}:${POSTGRES_PASSWORD:-qhb}@postgres:5432/${POSTGRES_DB:-qhb}
      PORT: "8080"
      HOST: 0.0.0.0
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${CONTROL_PLANE_PORT:-8080}:8080"

volumes:
  qhb-postgres-data:
